# CI: 阻止坏提交静默进 main。
#
# 本地无法真正触发 GitHub Actions —— 本文件必须 push 后在 GitHub 上实跑验证。
# 这里的命令逐一对应本地已通过的命令,以降低首跑失败概率:
#   后端: Python 3.11(本地 3.11.15)+ pip install -r backend/requirements.txt
#         + python -m pytest backend/tests -q -m "not live_llm"
#         (离线确定性,无需 Postgres/Redis;live_llm 用例靠 marker 跳过,不设任何真实 API key)
#   前端: Node 20 + pnpm@10.32.0(由 package.json packageManager 字段锁定)
#         + pnpm install --frozen-lockfile
#         + pnpm typecheck / lint / test / build(脚本名取自 frontend/package.json scripts)

name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 测试全程 mock 掉 PG/Redis/MinIO/LLM,这里只为让 pydantic Settings 能实例化
    # 提供 dummy 值(真实 .env 被 gitignore,CI 上不存在)。DEBUG=true 镜像本地,
    # 避开生产模式对默认 JWT 密钥的启动校验。
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      MINIO_API_URL: http://localhost:9000
      MINIO_CONSOLE_URL: http://localhost:9001
      MINIO_ROOT_USER: ci-minio
      MINIO_ROOT_PASSWORD: ci-minio-secret
      MINIO_BUCKET: ci-bucket
      DEBUG: "true"
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # 与本地一致: 离线跑,跳过 live_llm 标记的用例(不提供任何真实 API key)。
      - name: Run pytest (skip live_llm)
        run: python -m pytest backend/tests -q -m "not live_llm"

  frontend-checks:
    name: frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前启用,这样 setup-node 的 pnpm 缓存才能生效。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Lint (next lint)
        run: pnpm lint

      - name: Test (vitest run)
        run: pnpm test

      - name: Build (next build)
        run: pnpm build
